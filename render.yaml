# Blueprint de Render (Fase 5 del ROADMAP). Se aplica desde el dashboard de
# Render: "New" -> "Blueprint" -> conectar este repo -> Render lee este
# archivo y propone crear los recursos de abajo.
#
# El web service corre en el plan FREE y se "duerme" sin tráfico (decisión del
# 2026-07-01, ver ISSUES.md). El cron job de autogeneración de pagos NO tiene
# plan free en Render — se resolvió moviéndolo a GitHub Actions, ver
# .github/workflows/generar-pagos.yml.
#
# ⚠️ ESTADO AL 2026-09-08: el servicio que sirve `www.tugimapp.com` es
# **`app-gim-virginia`** (región Virginia, plan Starter), y NO está manejado
# por este Blueprint -- se creó a mano en el dashboard. Se migró de región
# porque el web estaba en Oregón y la base en `sa-east-1`, y cada query pagaba
# 182 ms de ida y vuelta: el panel de inicio tardaba ~5,6 s. Hoy el RTT es de
# ~2 ms. Ver `ISSUES.md`.
#
# Por qué a mano y no por Blueprint: la región de un servicio NO es editable
# después de crearlo, y `generateValue: true` sobre `DJANGO_SECRET_KEY` le
# habría generado una clave nueva, deslogueando a todos. Este archivo sigue
# describiendo el servicio VIEJO (`app-gim`, Oregón), que queda prendido y sin
# dominio como vuelta atrás. **Por eso `region:` no se toca acá**: un sync
# contra un servicio ya creado no puede cambiarla.
#
# Lo que este archivo sí garantiza, y es su valor hoy: la lista completa de
# variables que la app necesita. `config/tests.py::
# BlueprintDeclaraLoQueSettingsLeeTests` falla si `settings.py` lee una que
# acá no está.
#
# La BASE DE DATOS ya no la maneja Render: vive en Neon (free permanente). El
# Postgres free de Render expiraba a los 30 días + 14 de gracia, y después
# Render borra los datos -- por eso se migró el 2026-07-29 (ver ISSUES.md).
# `DATABASE_URL` se carga a mano en el dashboard con la URL POOLED de Neon.
#
# No corre `npm`/Tailwind en el build: static/css/app.css ya viene compilado
# y versionado en el repo (ver CLAUDE.md, sección "UI y white-label").

services:
  - type: web
    name: app-gim
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Completar a mano en el dashboard con la URL real que Render asigna
      # (algo como app-gim-xxxx.onrender.com) recién visible después del
      # primer deploy -- no se puede predecir de antemano si el nombre
      # exacto "app-gim" ya está tomado por otra cuenta.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # URL POOLED de Neon. La DIRECTA (sin `-pooler` en el host) se usa solo
      # desde .github/workflows/backup.yml: el pooler no sostiene bien la
      # sesión larga de un pg_dump.
      - key: DATABASE_URL
        sync: false
      # Credenciales de Cloudflare R2 (bucket + token creados a mano en el
      # dashboard de Cloudflare -- ver CLAUDE.md). Sin esto, Django usa
      # FileSystemStorage local, que en Render se borra en cada deploy.
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      # Parte C: integración opcional con Google Calendar (OAuth por alumno).
      # Credenciales creadas en Google Cloud Console (ver CLAUDE.md). Sin las 4,
      # la integración queda apagada y el portal usa solo el deep-link.
      # GOOGLE_OAUTH_REDIRECT_URI = https://<URL de Render>/calendario/callback/
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      # Frente C: login con Google para staff. Comparte CLIENT_ID/SECRET con
      # Calendar y agrega su propio redirect. Faltaba en este archivo, y no
      # era un olvido inofensivo: con los otros dos del grupo declarados y
      # este no, el grupo queda 2 de 3 y `_bandera_todo_o_nada` lanza
      # `ImproperlyConfigured` -- el servicio NO ARRANCA. Se descubrió
      # recreando el servicio en otra región (2026-09-08).
      # GOOGLE_LOGIN_REDIRECT_URI = https://<dominio>/accounts/google/callback/
      - key: GOOGLE_LOGIN_REDIRECT_URI
        sync: false
      # "Olvidé mi contraseña" por email (SMTP de Resend), SOLO para staff.
      # Las 4 o ninguna: sin ellas el link queda oculto y `EMAIL_BACKEND` cae
      # al de consola. `EMAIL_PORT`/`EMAIL_USE_TLS` NO van acá: son
      # constantes fijas en settings.py.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Web Push (PWA). Las 3 o ninguna -> `PUSH_ENABLED`. El par
      # público/privado tiene que ser IDÉNTICO al de los secrets de GitHub
      # Actions, o las suscripciones creadas con una clave se rechazan al
      # firmar con la otra: el cron termina en verde y no entrega nada.
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_ADMIN_EMAIL
        sync: false
