# Reconciliación de cobros online de la suscripción
# (suscripcion.services.reconciliar_pendientes, ver
# suscripcion/management/commands/reconciliar_cobros.py).
#
# Red de seguridad para «el webhook de Mercado Pago se perdió y el usuario
# cerró la pestaña»: busca los pagos de los intentos recientes que quedaron sin
# acreditar y los acredita. NO es el camino principal (ese es el webhook y la
# vuelta del navegador). GitHub retrasa los `schedule` del plan free 2-4 h, así
# que no hay que contar con la puntualidad.
#
# Vive acá y no en render.yaml porque Render no ofrece plan free para cron jobs
# (mismo criterio que generar-pagos.yml).

name: Reconciliar cobros de la suscripción

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 h; GitHub los retrasa 2-4 h en el plan free
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconciliar-cobros-production
  cancel-in-progress: false

jobs:
  reconciliar:
    # Con la variable de repo CI_RUNNER=self-hosted corre en la Mac del dueño;
    # sin ella, en GitHub. Ver ISSUES.md [2026-10-11].
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # SHA pineado, no tag (mismo criterio que generar-pagos.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: runner.environment != 'self-hosted'
        with:
          python-version: "3.14"
          cache: pip
      # En el runner propio, setup-python no anda (el Python que baja para macOS
      # trae fija una ruta que solo existe en las máquinas de GitHub; ver el CI
      # de Vektor): se usa el python3.14 de la Mac, en un venv por job.
      - name: Python de la máquina (runner propio)
        if: runner.environment == 'self-hosted'
        run: |
          PY="$(command -v python3.14 || echo /Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14)"
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      # A diferencia de expirar-solicitudes, este comando habla con Mercado Pago
      # Y manda mails (avisos de cobro acreditado), así que necesita más secrets.
      # Sin las EMAIL_* el mail cae al backend de consola en silencio: el cobro
      # se acredita igual pero nadie se entera. Sin MERCADOPAGO_* el comando
      # sale con error a propósito (workflow en rojo, sin ping).
      - name: Correr reconciliar_cobros
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_POOLED }}
          DJANGO_DEBUG: "False"
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          COBROS_AVISO_EMAIL: ${{ secrets.COBROS_AVISO_EMAIL }}
        run: python manage.py reconciliar_cobros

      # Refresca los tokens OAuth de Mercado Pago de las tiendas (y borra los de
      # las cuentas desconectadas hace más de 7 días). `!cancelled()`: que una
      # falla de la reconciliación no deje vencer tokens. Con la bandera apagada
      # (sin las 4 variables) sale 0 «apagado», SALVO que exista una cuenta
      # conectada: eso es un secret olvidado y sale 1 (workflow en rojo, sin
      # ping). Los avisos al staff usan las mismas VAPID_* que los recordatorios.
      - name: Refrescar cuentas de Mercado Pago de la tienda
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_POOLED }}
          DJANGO_DEBUG: "False"
          MERCADOPAGO_CLIENT_ID: ${{ secrets.MERCADOPAGO_CLIENT_ID }}
          MERCADOPAGO_CLIENT_SECRET: ${{ secrets.MERCADOPAGO_CLIENT_SECRET }}
          MERCADOPAGO_OAUTH_REDIRECT_URI: ${{ secrets.MERCADOPAGO_OAUTH_REDIRECT_URI }}
          MP_TOKEN_ENCRYPTION_KEY: ${{ secrets.MP_TOKEN_ENCRYPTION_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_ADMIN_EMAIL: ${{ secrets.VAPID_ADMIN_EMAIL }}
        run: python manage.py refrescar_cuentas_mp

      # Acredita los pagos de Mercado Pago de la tienda cuyo webhook se perdió
      # (pedidos de los últimos 7 días que no quedaron pagados). Misma regla de
      # salida que el paso de arriba: bandera apagada -> 0 «apagado», salvo que
      # exista una cuenta conectada (-> 1). Las VAPID_* mandan los avisos de
      # «pago acreditado» al staff y al alumno.
      - name: Reconciliar pedidos de Mercado Pago de la tienda
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_POOLED }}
          DJANGO_DEBUG: "False"
          MERCADOPAGO_CLIENT_ID: ${{ secrets.MERCADOPAGO_CLIENT_ID }}
          MERCADOPAGO_CLIENT_SECRET: ${{ secrets.MERCADOPAGO_CLIENT_SECRET }}
          MERCADOPAGO_OAUTH_REDIRECT_URI: ${{ secrets.MERCADOPAGO_OAUTH_REDIRECT_URI }}
          MP_TOKEN_ENCRYPTION_KEY: ${{ secrets.MP_TOKEN_ENCRYPTION_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_ADMIN_EMAIL: ${{ secrets.VAPID_ADMIN_EMAIL }}
        run: python manage.py reconciliar_pedidos

      # Lo mismo para las cuotas cobradas por Mercado Pago (a la misma cuenta
      # OAuth del gimnasio): intentos de los últimos 7 días que no quedaron
      # cobrados; de paso vence los links expirados. Misma regla de salida:
      # bandera apagada -> 0 «apagado», salvo que exista una cuenta conectada
      # (-> 1). Las VAPID_* mandan los avisos de «cuota cobrada».
      - name: Reconciliar cuotas cobradas por Mercado Pago
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_POOLED }}
          DJANGO_DEBUG: "False"
          MERCADOPAGO_CLIENT_ID: ${{ secrets.MERCADOPAGO_CLIENT_ID }}
          MERCADOPAGO_CLIENT_SECRET: ${{ secrets.MERCADOPAGO_CLIENT_SECRET }}
          MERCADOPAGO_OAUTH_REDIRECT_URI: ${{ secrets.MERCADOPAGO_OAUTH_REDIRECT_URI }}
          MP_TOKEN_ENCRYPTION_KEY: ${{ secrets.MP_TOKEN_ENCRYPTION_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_ADMIN_EMAIL: ${{ secrets.VAPID_ADMIN_EMAIL }}
        run: python manage.py reconciliar_cuotas_mp

      # Alerta por AUSENCIA de ping (mismo criterio que los otros crons). El
      # guard va adentro del paso: los secrets no se pueden evaluar en `if`.
      - name: Avisar a Healthchecks
        env:
          PING: ${{ secrets.HEALTHCHECKS_URL_RECONCILIAR_COBROS }}
        run: |
          if [ -n "$PING" ]; then
            curl -fsS -m 10 --retry 3 "$PING"
          else
            echo "HEALTHCHECKS_URL_RECONCILIAR_COBROS sin cargar: se saltea el ping."
          fi
