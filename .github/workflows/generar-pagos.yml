# Autogeneración mensual de pagos pendientes (pagos.generar_pagos_pendientes +
# marcar_vencidos, ver pagos/management/commands/generar_pagos.py).
#
# Vive acá y no en render.yaml porque Render no ofrece plan free para cron jobs
# (ver ISSUES.md 2026-07-01). Desde Fase 5 el comando había quedado para correr
# a mano desde la Shell de Render; esto lo destraba.
#
# Ver el diseño completo en:
#   docs/superpowers/specs/2026-07-29-respaldo-y-migracion-neon-design.md

name: Generar pagos del mes

# Reactivado el 2026-09-08, cerrando la migración a cuotas por ciclo de 28
# días. Estuvo apagado a propósito entre el merge y el deploy: este workflow
# hace `checkout` de `main` y corre contra la base de PRODUCCIÓN sin correr
# `migrate` (Render migra dentro de su `buildCommand`), así que en esa ventana
# habría corrido código nuevo sobre esquema viejo. Si volvés a hacer una
# migración destructiva, volvé a comentar el `schedule` antes del merge.
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC, después del backup para no solaparse
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generar-pagos-production
  cancel-in-progress: false

jobs:
  generar:
    # Con la variable de repo CI_RUNNER=self-hosted corre en la Mac del dueño;
    # sin ella, en GitHub. Ver ISSUES.md [2026-10-11].
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # SHA pineado, no tag: un tag es mutable y puede reapuntarse a otro commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: runner.environment != 'self-hosted'
        with:
          python-version: "3.14"
          cache: pip
      # En el runner propio, setup-python no anda (el Python que baja para macOS
      # trae fija una ruta que solo existe en las máquinas de GitHub; ver el CI
      # de Vektor): se usa el python3.14 de la Mac, en un venv por job.
      - name: Python de la máquina (runner propio)
        if: runner.environment == 'self-hosted'
        run: |
          PY="$(command -v python3.14 || echo /Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14)"
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      # No se pasan las R2_* ni las GOOGLE_*: sin ellas Django cae a
      # FileSystemStorage y deja GOOGLE_CALENDAR_ENABLED=False, y este comando
      # no toca ni archivos ni calendarios. Tampoco DJANGO_SECRET_KEY: un
      # management command no lo usa y hay fallback de dev. Menos secrets
      # copiados = menos superficie. DJANGO_DEBUG sí hace falta: en config/db.py
      # `ssl_require=not debug` depende de ella para exigir TLS contra Neon.
      #
      # Va la URL POOLED (al revés que backup.yml, que necesita la directa): son
      # conexiones cortas, que es justo para lo que sirve el pooler.
      - name: Correr generar_pagos
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_POOLED }}
          DJANGO_DEBUG: "False"
        run: python manage.py generar_pagos

      # Mismo criterio que backup.yml: se alerta por AUSENCIA de ping, que es
      # lo único que cubre a la vez el comando fallido, el workflow desactivado
      # por inactividad del repo y GitHub Actions caído. Desde la migración a
      # cuotas por ciclo este cron es el ÚNICO emisor de facturación *y* el
      # insumo del bloqueo por falta de pago: que se caiga en silencio significa
      # un gimnasio que deja de cobrar sin enterarse.
      #
      # `if: secrets.X != ''` no es válido en GitHub Actions (los secrets no se
      # pueden evaluar en `if`), así que el guard va adentro del paso: sin el
      # secret cargado el ping se saltea y el workflow no falla por eso.
      - name: Avisar a Healthchecks
        env:
          PING: ${{ secrets.HEALTHCHECKS_URL_GENERAR_PAGOS }}
        run: |
          if [ -n "$PING" ]; then
            curl -fsS -m 10 --retry 3 "$PING"
          else
            echo "HEALTHCHECKS_URL_GENERAR_PAGOS sin cargar: se saltea el ping."
          fi
