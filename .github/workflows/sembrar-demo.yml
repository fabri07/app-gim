# Llena (o vacía) una cuenta de PRUEBA con datos de demostración, para poder
# mostrar la app en capturas y videos.
#
# Vive acá y no se corre desde la Shell de Render por el mismo motivo que
# generar-pagos.yml: el plan free de Render no incluye Shell. Este workflow es
# la única forma de correr un management command contra producción.
#
# SOLO manual (`workflow_dispatch`): no tiene `schedule` a propósito.

name: Sembrar datos de demo

on:
  workflow_dispatch:
    inputs:
      gimnasio:
        description: "Slug del gimnasio de PRUEBA (nunca uno de un cliente)"
        required: true
        default: "gimnasio-verificacion-r2"
      accion:
        description: "Qué hacer"
        required: true
        default: "sembrar"
        type: choice
        options: [sembrar, borrar]
      alumnos:
        description: "Cuántos alumnos crear (solo al sembrar)"
        required: false
        default: "24"
      confirmar:
        # El comando se niega si el gimnasio destino ya tiene alumnos que no
        # son de demo. Eso pasa en una cuenta de prueba donde se cargó algún
        # alumno a mano, así que hace falta una salida -- pero como casilla
        # aparte, en "no" por default: apuntarle a un gimnasio real exige DOS
        # actos deliberados (tipear su slug Y destildar esta protección), no
        # uno solo.
        description: "El gimnasio ya tiene alumnos cargados a mano y quiero sembrar igual"
        required: true
        default: "no"
        type: choice
        # Entrecomillados: en YAML un `no` pelado es el booleano `false`, así
        # que la opción se renderizaría como "false" y el default "no" no
        # matchearía ninguna opción de la lista.
        options: ["no", "si"]
      tienda:
        # Con alumnos reales la tienda NO se siembra salvo esta casilla: con
        # las dos en «si» es la cuenta de prueba con algún alumno a mano.
        description: "Sembrar la tienda aunque haya alumnos cargados a mano"
        required: true
        default: "no"
        type: choice
        options: ["no", "si"]

permissions:
  contents: read

concurrency:
  group: sembrar-demo-production
  cancel-in-progress: false

jobs:
  sembrar:
    # Con la variable de repo CI_RUNNER=self-hosted corre en la Mac del dueño;
    # sin ella, en GitHub. Ver ISSUES.md [2026-10-11].
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # SHA pineado, no tag: un tag es mutable y puede reapuntarse a otro commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: runner.environment != 'self-hosted'
        with:
          python-version: "3.14"
          cache: pip
      # En el runner propio, setup-python no anda (el Python que baja para macOS
      # trae fija una ruta que solo existe en las máquinas de GitHub; ver el CI
      # de Vektor): se usa el python3.14 de la Mac, en un venv por job.
      - name: Python de la máquina (runner propio)
        if: runner.environment == 'self-hosted'
        run: |
          PY="$(command -v python3.14 || echo /Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14)"
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt

      # `--confirmar` solo si la casilla del formulario dice "si", y esa casilla
      # arranca en "no". El comando ya se niega cuando el gimnasio destino
      # tiene alumnos que no son de demo; apuntarle a un cliente real exige
      # entonces DOS actos deliberados, no un slug tipeado mal.
      #
      # No se pasan las VAPID_*: sin ellas `PUSH_ENABLED` queda en False, así
      # que además del silenciado que ya hace el comando, no hay forma de que
      # esto dispare una notificación. Ese candado NO tiene escape.
      #
      # URL POOLED (igual que generar-pagos): son conexiones cortas.
      # DJANGO_DEBUG sí hace falta: `config/db.py` usa `ssl_require=not debug`
      # para exigir TLS contra Neon.
      - name: Sembrar o borrar
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_POOLED }}
          DJANGO_DEBUG: "False"
          GIMNASIO: ${{ inputs.gimnasio }}
          ACCION: ${{ inputs.accion }}
          ALUMNOS: ${{ inputs.alumnos }}
          CONFIRMAR: ${{ inputs.confirmar }}
          TIENDA: ${{ inputs.tienda }}
        run: |
          if [ "$ACCION" = "borrar" ]; then
            python manage.py sembrar_demo --gimnasio "$GIMNASIO" --borrar
            exit 0
          fi
          extra=""
          if [ "$CONFIRMAR" = "si" ]; then
            echo "::warning::Sembrando con --confirmar sobre «$GIMNASIO»: tiene alumnos cargados a mano."
            extra="--confirmar"
            if [ "$TIENDA" = "si" ]; then
              extra="$extra --con-tienda"
            fi
          fi
          python manage.py sembrar_demo --gimnasio "$GIMNASIO" --alumnos "$ALUMNOS" $extra
