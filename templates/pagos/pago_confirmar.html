{% extends 'base.html' %}
{% block title %}Confirmar pago · App Gimnasios{% endblock %}

{% block content %}
<div class="tarjeta">
  <h1>Confirmar pago</h1>
  <p class="texto-suave">{{ object.alumno }} &middot; {{ object.periodo_inicio|date:"d/m/Y" }} al {{ object.periodo_fin|date:"d/m/Y" }}</p>
  <form method="post" enctype="multipart/form-data" novalidate hx-boost="false">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Confirmar pago</button>
    <a class="boton-secundario" href="{% url 'pagos:listado' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
