{% extends 'base.html' %}
{% block title %}{% if object %}Editar{% else %}Nuevo{% endif %} medio de cobro · App Gimnasios{% endblock %}

{% block content %}
<div class="tarjeta">
  <h1>{% if object %}Editar medio de cobro{% else %}Nuevo medio de cobro{% endif %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Guardar</button>
    <a class="boton-secundario" href="{% url 'pagos:medios_listado' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
