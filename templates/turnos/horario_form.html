{% extends 'base.html' %}
{% block title %}Nuevo horario de atención · App Gimnasios{% endblock %}

{% block content %}
<div class="tarjeta">
  <h1>Nuevo horario de atención</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Guardar</button>
    <a class="boton-secundario" href="{% url 'turnos:configuracion' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
