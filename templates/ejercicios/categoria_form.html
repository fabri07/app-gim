{% extends 'base.html' %}
{% block title %}{% if object %}Editar{% else %}Nueva{% endif %} categoría · App Gimnasios{% endblock %}

{% block content %}
<div class="tarjeta">
  <h1>{% if object %}Editar categoría{% else %}Nueva categoría{% endif %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Guardar</button>
    <a class="boton-secundario" href="{% url 'ejercicios:categorias_listado' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
