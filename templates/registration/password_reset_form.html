{% extends 'base.html' %}
{% block title %}Recuperar contraseña · App Gimnasios{% endblock %}

{% block content %}
<div class="tarjeta">
  <h1>Recuperar contraseña</h1>
  <p class="texto-suave">
    Ingresá el email con el que entrás como staff y te mandamos instrucciones
    para elegir una contraseña nueva.
  </p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Enviar instrucciones</button>
  </form>
</div>
{% endblock %}
