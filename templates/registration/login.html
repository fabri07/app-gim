{% extends 'base.html' %}
{% block title %}Ingresar · App Gimnasios{% endblock %}

{% block content %}
<div class="tarjeta">
  <h1>Ingresar</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
  </form>
  <p><a href="{% url 'register' %}">Registrar un gimnasio nuevo</a></p>
</div>
{% endblock %}
