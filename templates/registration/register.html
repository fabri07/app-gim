{% extends 'base.html' %}
{% block title %}Crear gimnasio · App Gimnasios{% endblock %}

{% block content %}
<div class="tarjeta">
  <h1>Registrar tu gimnasio</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Crear cuenta</button>
  </form>
  <p><a href="{% url 'login' %}">Ya tengo cuenta · Ingresar</a></p>
</div>
{% endblock %}
