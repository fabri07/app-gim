{% extends 'base.html' %}
{% block title %}Cambiar contraseña · App Gimnasios{% endblock %}

{% block content %}
<div class="tarjeta">
  <h1>Cambiar contraseña</h1>
  <p class="texto-suave">
    Ingresá tu contraseña actual y elegí una nueva.
  </p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Cambiar contraseña</button>
  </form>
</div>
{% endblock %}
